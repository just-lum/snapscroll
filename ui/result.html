<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>SnapScroll 結果</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    .viewer {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(45deg, #14181f 25%, transparent 25%, transparent 75%, #14181f 75%),
        linear-gradient(45deg, #14181f 25%, #12151a 25%, #12151a 75%, #14181f 75%);
      background-size: 18px 18px;
      background-position: 0 0, 9px 9px;
      overflow: auto;
      max-height: 62vh;
      cursor: crosshair;
      user-select: none;
    }

    .viewer img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .crop-box {
      position: absolute;
      border: 1.5px solid var(--accent);
      background: rgba(56, 189, 248, 0.14);
      box-shadow: 0 0 0 9999px rgba(6, 8, 12, 0.55);
      pointer-events: none;
      display: none;
    }

    .crop-tag {
      position: absolute;
      transform: translateY(-100%);
      padding: 1px 6px;
      border-radius: 5px 5px 0 0;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
      gap: 14px;
    }

    .history-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .history-card:hover {
      border-color: var(--line-hi);
      transform: translateY(-2px);
    }

    .history-thumb {
      height: 132px;
      background: #0f1217;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }

    .history-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .history-meta {
      padding: 9px 11px 11px;
      min-width: 0;
    }

    .history-title {
      font-weight: 600;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-sub {
      margin-top: 3px;
      font-size: 11px;
      color: var(--dim-2);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid var(--line-hi);
      background: var(--bg-soft);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--dim);
      text-transform: uppercase;
    }

    .empty {
      padding: 54px 20px;
      text-align: center;
      color: var(--dim-2);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px 18px;
      margin-top: 4px;
    }

    .meta-grid dt {
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--dim-2);
      margin: 0 0 2px;
    }

    .meta-grid dd {
      margin: 0;
      font-family: var(--mono);
      font-size: 12.5px;
      word-break: break-all;
    }
  </style>
</head>
<body class="page">
  <div class="shell wide">
    <header class="shell-head">
      <div>
        <h1 id="pageTitle" data-i18n="result_title">擷取結果</h1>
        <p id="pageSubtitle" data-i18n="result_subtitle">預覽、裁剪、換一種格式再存一次。</p>
      </div>
      <div class="row" id="headActions"></div>
    </header>
    <div id="content"></div>
  </div>

  <script src="../engine/limits.js"></script>
  <script src="../common/history.js"></script>
  <script src="../common/i18n.js"></script>
  <script src="result.js"></script>
</body>
</html>
