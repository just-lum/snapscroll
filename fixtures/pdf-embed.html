<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>SnapScroll 測試頁 · 模擬 PDF 檢視器</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e13;
      color: #e8edf6;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    embed {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .note {
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(17, 19, 24, 0.9);
      color: #97a1b4;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- 這一頁複製了 Chrome 內建 PDF 檢視器的關鍵特徵：
       內容交給 <embed> 外掛繪製，外層 document 沒有可捲動的元素。
       擴充功能必須認出它，並明確說「這是 PDF」，
       而不是回報一句莫名其妙的「滾不動」或「只有一屏」。 -->
  <embed type="application/pdf" src="__missing__.pdf">
  <div class="note">模擬 PDF 檢視器（內容由外掛繪製）</div>

  <script>
    window.__fixture = {
      name: 'pdf-embed',
      height: function () { return document.documentElement.scrollHeight; },
      scrollContainer: 'plugin'
    };
  </script>
</body>
</html>
