<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>SnapScroll 測試頁 · overflow:hidden 但內容溢出</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    /* 使用者滾不動（沒有捲軸、滾輪沒反應），但內容確實有 7000px 高，
     * 而且程式化設定 scrollTop 仍然有效。
     *
     * 真實世界裡 modal 打開時的 body 就是這個狀態。擴充功能不該被它擋住——
     * 而且它比使用者自己能做到的還多：使用者滾不到的地方，它拍得到。 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e13;
      color: #e8edf6;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #content { height: 7000px; }

    .band {
      position: relative;
      height: 500px;
      padding: 24px 26px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .band.odd { background: #0e131b; }
    .band .index {
      font: 800 64px/1 ui-monospace, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: #fbbf24;
    }
    .band .caption { margin-top: 6px; color: #7d8aa1; font-size: 13px; }
    .swatch {
      position: absolute;
      left: 28px;
      bottom: 22px;
      width: 220px;
      height: 26px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main id="content"></main>
  <script>
    var BANDS = 14;
    var palette = ['#2f7ff0', '#34d399', '#fbbf24', '#f472b6', '#38bdf8', '#a78bfa'];
    var html = [];
    for (var i = 0; i < BANDS; i++) {
      html.push(
        '<section class="band' + (i % 2 ? ' odd' : '') + '">' +
        '  <div class="index">' + String(i + 1).padStart(3, '0') + '</div>' +
        '  <div class="caption">段落 ' + (i + 1) + ' / ' + BANDS + ' · 使用者滾不動，但程式可以</div>' +
        '  <div class="swatch" style="background:linear-gradient(90deg,' +
             palette[i % palette.length] + ',' + palette[(i + 3) % palette.length] + ')"></div>' +
        '</section>'
      );
    }
    document.getElementById('content').innerHTML = html.join('');

    window.__fixture = {
      name: 'scroll-hidden-overflow',
      bands: BANDS,
      height: function () { return document.body.scrollHeight; },
      scrollContainer: 'body-hidden'
    };
  </script>
</body>
</html>
